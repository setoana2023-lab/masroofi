<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="مصروفي: مصروف البيت بين الزوج والزوجة والأولاد، بالكتابة أو بالصوت.">

<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">

<style>html{color-scheme:light;-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}*{box-sizing:border-box}</style>
<title>مصروفي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-width column; the balance sits in a paper "money envelope" (ظرف المصروف), big actions under it, tab bar fixed at the bottom. */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --surface2:#E2E9E0; --line:#CFD9CD;
  --ink:#14231C; --muted:#5A6A61;
  --green:#18704B; --green-soft:#D8EDE0; --on-accent:#FFFFFF;
  --amber:#9A6407; --amber-soft:#F8EBCB;
  --red:#AE3423; --red-soft:#F6DDD7;
  --kraft:#E7D9BC; --kraft-ink:#6D5A35;
  --scrim:rgba(10,20,15,.45);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --r:16px;
  font-size:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1411; --surface:#16201B; --surface2:#1F2B25; --line:#2C3A32;
  --ink:#E5EEE8; --muted:#9BABA2;
  --green:#4BC48C; --green-soft:#16352A; --on-accent:#08130E;
  --amber:#E6B04B; --amber-soft:#382A0F;
  --red:#F07D6B; --red-soft:#3C1C17;
  --kraft:#3A3121; --kraft-ink:#D9C597;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#16201B; --surface2:#1F2B25; --line:#2C3A32;
  --ink:#E5EEE8; --muted:#9BABA2;
  --green:#4BC48C; --green-soft:#16352A; --on-accent:#08130E;
  --amber:#E6B04B; --amber-soft:#382A0F;
  --red:#F07D6B; --red-soft:#3C1C17;
  --kraft:#3A3121; --kraft-ink:#D9C597;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}
html.big{font-size:20px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:10px calc(96px + env(safe-area-inset-bottom,0px))}
main{display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:1.05rem;font-weight:600}
small{color:var(--muted);font-size:.82rem}
bdi{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.neg{color:var(--red)} .pos{color:var(--green)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.top-id{display:flex;align-items:center;gap:10px;min-width:0}
.top-em{font-size:1.7rem;line-height:1}
.top-fam{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.top-who{color:var(--muted);font-size:.85rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:52px;padding:0 1rem;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:600;font-size:1rem;text-align:center}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.btn.alt{background:var(--kraft);border-color:var(--kraft);color:var(--kraft-ink)}
.btn.warn{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.btn.danger{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.btn.big{min-height:96px;flex-direction:column;font-size:1.2rem;border-radius:20px}
.btn.big .bi{font-size:2rem;line-height:1}
.btn.sm{min-height:40px;font-size:.88rem;padding:0 .8rem;border-radius:11px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);border-radius:11px;min-height:38px;padding:0 .8rem;font-size:.88rem;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--green);font-weight:600;padding:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.rowflex{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* envelope */
.env{position:relative;background:var(--kraft);color:var(--kraft-ink);border-radius:20px;padding:44px 18px 16px;overflow:hidden}
.env::before{content:"";position:absolute;inset:0 0 auto 0;height:40px;background:var(--surface2);clip-path:polygon(0 0,100% 0,50% 100%);opacity:.75}
.env-lbl{font-family:var(--f-display);font-size:.95rem;position:relative}
.amt{font-family:var(--f-display);font-weight:700;font-size:2.7rem;line-height:1.15;color:var(--ink);position:relative;font-variant-numeric:tabular-nums}
.amt small{font-size:1rem;color:var(--kraft-ink);font-weight:600}
.env.s-bad .amt{color:var(--red)}
.env.s-warn .amt{color:var(--amber)}
.env-st{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;position:relative}
.env-sub{margin-top:8px;font-size:.88rem;position:relative}
.env .ghost{border-color:var(--kraft-ink);color:var(--kraft-ink)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:99px;font-size:.84rem;font-weight:600;background:var(--surface2);color:var(--ink);border:1px solid transparent;white-space:nowrap}
.chip.good{background:var(--green-soft);color:var(--green)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.bad{background:var(--red-soft);color:var(--red)}
button.chip{min-height:40px;padding:0 14px;font-family:var(--f-display)}
button.chip.on{background:var(--green);color:var(--on-accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:start;width:100%}
.rows .row:last-child{border-bottom:0}
.ic{width:44px;height:44px;border-radius:13px;background:var(--surface2);display:grid;place-items:center;font-size:1.35rem}
.rmain{display:flex;flex-direction:column;min-width:0}
.rt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{color:var(--muted);font-size:.8rem}
.ramt{font-family:var(--f-display);font-weight:600;white-space:nowrap}
.row.del .rt{text-decoration:line-through;color:var(--muted)}
.day-h{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:.88rem;color:var(--muted);padding-top:6px}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.alert.req{background:var(--amber-soft);border-color:var(--amber)}
.alert.bad{border-color:var(--red)}
.al-ic{font-size:1.4rem;line-height:1.2}
.al-b{display:flex;flex-direction:column;gap:4px;min-width:0}
.al-b button.plain{background:none;border:0;padding:0;text-align:start}
.al-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.x{background:none;border:0;color:var(--muted);font-size:1rem;width:32px;height:32px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:86px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:.86rem;font-weight:600;padding:6px}
.tile .e{font-size:1.9rem;line-height:1}
.tile.on{border:2px solid var(--green);background:var(--green-soft)}

/* bars */
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--green)}
.bar.warn>i{background:var(--amber)} .bar.bad>i{background:var(--red)}
.cbar{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.cbar .bar{grid-column:2/4}

/* reminders */
.rem{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:12px;border-radius:14px;background:var(--surface);border:1.5px dashed var(--kraft-ink)}
.rem .al-act{grid-column:1/3}

/* tabs */
.tabs{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs-in{max-width:520px;margin:0 auto;display:grid}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;font-size:.78rem;font-weight:600;color:var(--muted)}
.tabs button span{font-size:1.35rem;line-height:1.2;filter:grayscale(.8)}
.tabs button.on{color:var(--green)}
.tabs button.on span{filter:none}

/* sheets */
.ov{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sh{background:var(--bg);width:100%;max-width:520px;max-height:94%;overflow-y:auto;border-radius:22px 22px 0 0;padding:14px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-h h2{font-size:1.2rem}
.steps{display:flex;gap:6px}
.steps i{width:28px;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--green)}
.display{font-family:var(--f-display);font-weight:700;font-size:3rem;text-align:center;font-variant-numeric:tabular-nums;padding:4px 0;border-bottom:2px solid var(--line)}
.display small{font-size:1rem}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{min-height:62px;font-family:var(--f-display);font-weight:600;font-size:1.55rem;border-radius:15px;background:var(--surface);border:1px solid var(--line)}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.quick button{min-height:42px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);padding:0 14px;font-family:var(--f-display);font-weight:600}
label.fld{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.92rem}
.inp{width:100%;min-height:50px;border-radius:13px;border:1px solid var(--line);background:var(--surface);padding:8px 12px;font-size:1rem}
textarea.inp{min-height:96px;resize:vertical;line-height:1.6}
.hint{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:.9rem}
.rcpt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.rcpt img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.receipt-full{width:100%;border-radius:14px;border:1px solid var(--line)}
.sum{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.sum .ic{width:56px;height:56px;font-size:1.8rem}
.sum .amt{font-size:1.9rem}
.mic{width:120px;height:120px;border-radius:50%;border:0;background:var(--green);color:var(--on-accent);font-size:3rem;margin:0 auto;display:grid;place-items:center}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--green-soft)}70%{box-shadow:0 0 0 22px transparent}100%{box-shadow:0 0 0 0 transparent}}
.vitem{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.vitem select{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);max-width:100%}
.thread{display:flex;flex-direction:column;gap:6px}
.msg{padding:8px 12px;border-radius:14px;background:var(--surface2);max-width:85%}
.msg.mine{align-self:flex-start;background:var(--green-soft)}
.msg.theirs{align-self:flex-end}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.93rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.pin-dots{display:flex;justify-content:center;gap:14px;padding:6px 0}
.pin-dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots i.on{background:var(--ink);border-color:var(--ink)}
.who-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.who-tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 8px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.who-tile .em{font-size:2.4rem;line-height:1.1}
.who-tile.new{border-style:dashed}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.sel-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sel-row select{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 10px;min-width:0}
.empty{text-align:center;padding:26px 10px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty .e{font-size:2.6rem}
.toast{position:fixed;inset:auto 16px calc(84px + env(safe-area-inset-bottom,0px)) 16px;max-width:488px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:40;font-weight:600}
.toast.bad{background:var(--red);color:var(--surface)}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:10px;min-height:36px;padding:0 12px;font-weight:700}
.loading{min-height:70vh;display:grid;place-items:center;text-align:center}
.logo{font-family:var(--f-display);font-weight:700;font-size:2.4rem;color:var(--green)}
.hero{padding:22px 0 8px;display:flex;flex-direction:column;gap:6px}
.hero p{margin:0;color:var(--muted)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:0}
.notice{border-radius:14px;padding:12px 14px;background:var(--amber-soft);color:var(--ink);font-size:.92rem}
.month-bars{display:flex;flex-direction:column;gap:12px}
@media (max-width:360px){.tiles{grid-template-columns:repeat(2,1fr)}.amt{font-size:2.2rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
a.btn{text-decoration:none}
.code{font-family:ui-monospace,Menlo,monospace;font-size:2rem;font-weight:700;letter-spacing:.3em;text-align:center;padding:10px;border:2px dashed var(--line);border-radius:14px;background:var(--surface2)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>

<script>

function numTok(t){
  if(!t) return null;
  if(/^\d+(\.\d+)?$/.test(t)) return {v:parseFloat(t),k:'d'};
  if(NW[t]) return NW[t];
  for(const p of ['وب','بال','ب','و']){
    if(t.startsWith(p)&&t.length>p.length){const r=t.slice(p.length);
      if(/^\d+(\.\d+)?$/.test(r)) return {v:parseFloat(r),k:'d'};
      if(NW[r]) return NW[r];}
  }
  return null;
}
function phraseVal(xs){
  let total=0,cur=0,lastMult=1;
  for(const x of xs){
    if(x.k==='m'){cur=(cur||1)*x.v;total+=cur;cur=0;lastMult=x.v}
    else if(x.k==='t'){total+=x.v;lastMult=1000}
    else if(x.k==='f'){ if(cur===0) total+=x.v*lastMult; else if(cur%100===0) cur+=x.v*100; else cur+=x.v }
    else if(x.k==='h'&&x.v===100&&cur>0&&cur<10){cur*=100;lastMult=100}
    else {cur+=x.v; if(x.k==='h') lastMult=100}
  }
  return Math.round((total+cur)*100)/100;
}
function detectCat(ws,cats){
  for(const w of ws){
    const cands=[w,w.replace(/^و/,''),w.replace(/^(وال|بال|ال)/,''),w.replace(/^و?(بال|ال)/,'')];
    for(const c of cats){ if(c.kw.some(k=>cands.includes(k))) return c.id }
  }
  return null;
}
function parseSpeech(text,kids){
  const cats=kids?KCATS:CATS;
  const orig=String(text).replace(/[,،.؟?!:؛;]+/g,' ').replace(/ـ/g,'').split(/\s+/).filter(Boolean);
  const toks=orig.map(norm);
  const items=[]; let words=[];
  let i=0;
  while(i<toks.length){
    const nt=numTok(toks[i]);
    if(nt&&nt.k!=='f'){
      const xs=[nt]; let j=i+1;
      while(j<toks.length){
        if(toks[j]==='و'&&numTok(toks[j+1])){j++;continue}
        const n2=numTok(toks[j]); if(!n2) break;
        xs.push(n2); j++;
      }
      if(j<toks.length&&UNITS.has(toks[j])){ for(let q=i;q<=j;q++) words.push({o:orig[q],n:toks[q]}); i=j+1; continue }
      items.push({amount:phraseVal(xs),words});
      words=[]; i=j;
    } else { words.push({o:orig[i],n:toks[i]}); i++ }
  }
  if(words.length&&items.length){
    const last=items[items.length-1];
    if(!detectCat(last.words.map(w=>w.n),cats)) last.words=last.words.concat(words);
  }
  return items.filter(it=>it.amount>0).map(it=>{
    const ns=it.words.map(w=>w.n);
    const cat=detectCat(ns,cats)||'other';
    const label=it.words.filter(w=>!STOP.has(w.n)&&!STOP.has(w.n.replace(/^و/,""))).map(w=>w.o.length>3&&/^و/.test(w.o)?w.o.slice(1):w.o).join(' ').replace(/^(ب|بـ)\s*/,'').trim();
    return {amount:it.amount,cat,label};
  });
}

    const paid=Object.values(ST.d.tx).some(t=>!t.deleted&&t.type==='deposit'&&t.to==='home'&&t.kind==='monthly'&&t.at>=+ps);
    const skipped=(f.skips||{})[key];
    if(!paid&&!skipped&&(!f.createdAt||+ps>=f.createdAt-2*DAY||true)) out.push({kind:'monthly',key,amount:+f.monthly,name:'مصروف الشهر',icon:'💵',date:ps});
  }
  if(isParent(me)){
    for(const [id,x] of Object.entries(ST.d.fixed)){
      if(x.off) continue;
      const inst=fixedInstance(x,now); if(!inst) continue;
      if((x.skips||{})[inst.key]) continue;
      const done=Object.values(ST.d.tx).some(t=>!t.deleted&&t.fixedId===id&&t.fixedKey===inst.key);
      if(done) continue;
      out.push(Object.assign({fid:id,key:inst.key,date:inst.date,icon:x.kind==='allowance'?'🧒':catOf(x.cat).i},x));
    }
  }
  return out;
}

const S={tab:'home',sheet:null,f:{},flt:{period:'month',person:'all',cat:'all',deleted:false},due:[],toast:null,auth:null,picking:false,busy:false,installEvt:null};
function meM(){const m=ST.d.members[ST.meId];return m&&!m.off?Object.assign({id:ST.meId},m):null}
function openSheet(o){S.sheet=o;S.f={};render()}
function closeSheet(){S.sheet=null;S.f={};render()}
function val(id){const el=document.getElementById(id);return el?el.value:(S.f[id]||'')}

let toastTimer=null;
function toast(msg,kind,undo){
  S.toast={msg,kind,undo};
  const el=$('#toast');
  el.innerHTML=`<div class="toast ${kind==='bad'?'bad':''}" role="status"><span>${esc(msg)}</span>${undo?'<button data-a="undo">تراجع</button>':''}</div>`;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.innerHTML='';S.toast=null},undo?10000:4500);

}

/* ---------- render ---------- */
function capture(){
  document.querySelectorAll('#app [id],#sheet [id]').forEach(el=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)&&el.type!=='file')S.f[el.id]=el.value});
  const a=document.activeElement;
  return {focus:a&&a.id&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)?{id:a.id,s:a.selectionStart,e:a.selectionEnd}:null,shScroll:($('.sh')||{}).scrollTop||0};
}
function restore(c){
  for(const id in S.f){const el=document.getElementById(id);if(el&&el.type!=='file')el.value=S.f[id]}
  if(c.focus){const el=document.getElementById(c.focus.id);if(el){el.focus({preventScroll:true});try{if(c.focus.s!=null)el.setSelectionRange(c.focus.s,c.focus.e)}catch(e){}}}
  const sh=$('.sh');if(sh&&c.shScroll)sh.scrollTop=c.shScroll;
}
function render(){
  const c=capture();
  $('#app').innerHTML=view();
  $('#sheet').innerHTML=S.sheet?`<div class="ov" data-a="ovClose"><div class="sh" role="dialog" aria-modal="true">${sheetV()}</div></div>`:'';
  restore(c);
}
function view(){
  if(!ST.token) return authV();
  const me=meM();
  if(!ST.d.family||!me) return `<div class="loading"><div><div class="logo">مصروفي</div><p class="muted">${ST.online?'بيفتح…':'مفيش نت. أول ما النت يرجع هيفتح.'}</p><button class="ghost" data-a="logout">خروج</button></div></div>`;
  if(S.picking) return pickerV(me);
  let body;
  if(S.tab==='list') body=listV(me);
  else if(S.tab==='kids'&&isParent(me)) body=kidsV(me);
  else if(S.tab==='more') body=moreV(me);
  else body=homeV(me);
  return headerV(me)+`<main>${body}</main>`+tabsV(me);
}

function envV(me){

  const lbl=me.role==='husband'?`الفلوس اللي مع ${esc(wifeName())}`:me.role==='wife'?'الفلوس اللي معاكي للبيت':isKid(me)?'فلوسي':'العُهدة اللي معاكي';
  const chip=st==='bad'?`<span class="chip bad">⚠️ ${me.role==='husband'?esc(wifeName())+' محتاجة '+num(-b)+' '+cur():isParent(me)?'محتاجة '+num(-b)+' '+cur()+' كمان':'الفلوس خلصت'}</span>`:st==='warn'?`<span class="chip warn">🪙 الرصيد قرب يخلص</span>`:`<span class="chip good">💰 الرصيد كويس</span>`;
  let sub='';
  if(isParent(me)){const ps=periodStart(new Date()),s=periodStats(ps,periodEnd(ps));sub=`<div class="env-sub">من أول الشهر: دخل ${money(s.dep,'')} · اتصرف ${money(s.exp,'')}</div>`}

function alertsV(me){
  const now=Date.now(),dis=new Set(LS.get('masroofi_dis_'+me.id,[]));
  const hard=[],soft=[];
  for(const [id,r] of Object.entries(ST.d.requests)){
    if(r.status!=='sent')continue;
    const inc=me.role==='husband'?(r.to==='husband'||r.to==='parents'):me.role==='wife'?r.to==='parents':false;
    if(!inc)continue;
    const fm=mem(r.from);
    hard.push(`<div class="alert req"><span class="al-ic">${fm?EM[fm.role]:'🙋'}</span><div class="al-b"><b>${esc(nm(r.from))} ${g(fm,'طالب','طالبة')} ${money(r.amount,'')}</b>${r.reason?`<small>${esc(r.reason)}</small>`:''}<div class="al-act"><button class="btn pri sm" data-a="payReq" data-id="${id}">ادفع</button><button class="btn sm" data-a="decReq" data-id="${id}">مش دلوقتي</button></div></div><span></span></div>`);
  }
  const T=txAll();
  for(const t of T){
    if(t.at<now-7*DAY&&!(t.edits||[]).length&&!t.deletedAt&&!(t.thread||[]).length)continue;
    const lab=esc(txLabel(t));
    if(isParent(me)){
      const e=(t.edits||[])[(t.edits||[]).length-1];
      if(e&&e.at>now-2*DAY&&e.by!==me.id){const em=mem(e.by);soft.push({k:'e'+t.id+e.at,at:e.at,ic:'✏️',id:t.id,h:+e.old.amount!==+t.amount?`${esc(nm(e.by))} ${g(em,'عدّل','عدّلت')} «${lab}» من ${money(e.old.amount,'')} لـ ${money(t.amount,'')}`:`${esc(nm(e.by))} ${g(em,'غيّر','غيّرت')} تفاصيل «${lab}»`})}
      if(t.deleted&&t.deletedAt>now-2*DAY&&t.deletedBy!==me.id){const em=mem(t.deletedBy);soft.push({k:'d'+t.id,at:t.deletedAt,ic:'🗑',id:t.id,h:`${esc(nm(t.deletedBy))} ${g(em,'مسح','مسحت')} «${lab}» (${money(t.amount,'')})`})}
      if(me.role==='husband'&&t.type==='expense'&&!t.deleted&&t.by!==me.id&&+t.amount>=(+fam().bigOver||500)&&t.at>now-2*DAY)soft.push({k:'b'+t.id,at:t.at,ic:'🔔',id:t.id,h:`مصروف كبير: «${lab}» ${money(t.amount,'')} · ${esc(nm(t.by))}`});
    }
    const th=t.thread||[],last=th[th.length-1];
    if(last&&last.by!==me.id&&last.at>now-3*DAY&&(t.by===me.id||th.some(m=>m.by===me.id)||(me.role==='husband'))){soft.push({k:'q'+t.id+last.at,at:last.at,ic:'💬',id:t.id,h:`${esc(nm(last.by))}: «${esc(last.text)}» على «${lab}»`})}
    if(t.type!=='expense'&&!t.deleted&&t.by!==me.id&&t.at>now-2*DAY){
      const mine=isParent(me)?(me.role==='wife'&&t.to==='home'):t.to===me.id;
      if(mine)soft.push({k:'r'+t.id,at:t.at,ic:'💰',id:t.id,h:`وصلك ${money(t.amount,'')} من ${esc(nm(t.by))}`});
    }
  }
  for(const [id,r] of Object.entries(ST.d.requests)){
    if(r.from!==me.id||r.status==='sent'||!r.doneAt||r.doneAt<now-2*DAY)continue;
    soft.push({k:'s'+id+r.status,at:r.doneAt,ic:r.status==='paid'?'✅':'⏳',h:r.status==='paid'?`${esc(nm(r.doneBy))} دفع طلبك ${money(r.amount,'')}`:`طلبك ${money(r.amount,'')} اتأجّل${r.reply?` · ${esc(r.reply)}`:''}`});
  }
  const sv=soft.filter(a=>!dis.has(a.k)).sort((a,b)=>b.at-a.at).slice(0,5).map(a=>`<div class="alert"><span class="al-ic">${a.ic}</span><div class="al-b">${a.id?`<button class="plain" data-a="openTx" data-id="${a.id}">${a.h}</button>`:`<span>${a.h}</span>`}<small>${dayLabel(a.at)} · ${tm(a.at)}</small></div><button class="x" data-a="dis" data-k="${a.k}" aria-label="إخفاء">✕</button></div>`);
  const all=hard.concat(sv);
  return all.length?`<section class="alerts" aria-label="تنبيهات">${all.join('')}</section>`:'';
}
function remindersV(me){
  S.due=dueList(me);
  if(!S.due.length) return '';
  return `<section class="stack" aria-label="مواعيد">${S.due.map((x,i)=>{
    const late=sod(x.date)<sod(Date.now());
    const lbl=x.kind==='monthly'?'دفعت':x.kind==='allowance'?(me.role==='husband'?'اديتهوله':'اديتهوله من البيت'):'دفعته';
    return `<div class="rem"><span class="ic">${x.icon}</span><div class="rmain"><b>${esc(x.name)}</b><small>${late?'ميعاده كان '+dayLabel(+x.date):'ميعاده النهارده'} · ${money(x.amount,'')}${x.kind==='allowance'?' لـ '+esc(nm(x.memberId)):''}</small></div><div class="al-act"><button class="btn pri sm" data-a="fxPaid" data-i="${i}">${lbl}</button><button class="btn sm" data-a="fxDiff" data-i="${i}">مبلغ مختلف</button><button class="ghost" data-a="fxSkip" data-i="${i}">مش دلوقتي</button></div></div>`}).join('')}</section>`;
}
function paceV(){
  const now=new Date(),ps=periodStart(now),pe=periodEnd(ps);
  const total=Math.round((+pe-+ps)/DAY),el=Math.min(total,Math.floor((+sod(now)-+ps)/DAY)+1),left=total-el;
  const s=periodStats(ps,pe),b=bal('home');
  let msg='',tone='good';
  if(b<0){msg='الرصيد سالب. البيت محتاج فلوس دلوقتي.';tone='bad'}
  else if(s.exp>0&&el>=3){const rate=s.exp/el,daysTo=b/rate;if(daysTo<left-7){msg=`بالمعدل ده الفلوس هتكفي حوالي ${dg(Math.max(0,Math.floor(daysTo)))} يوم، والشهر فاضل فيه ${dg(left)} يوم.`;tone='warn'}else msg='معدل الصرف مناسب.'}
  else msg='لسه بدري على الحكم على معدل الصرف.';
  return `<div class="card"><div class="card-h"><h2>الشهر المالي</h2><small>يوم ${dg(el)} من ${dg(total)}</small></div><div class="bar"><i style="width:${Math.round(el/total*100)}%"></i></div><span class="chip ${tone}" style="white-space:normal">${msg}</span></div>`;
}
function catBarsV(){
  const ps=periodStart(new Date()),s=periodStats(ps,periodEnd(ps));
  const arr=Object.entries(s.cats).sort((a,b)=>b[1]-a[1]);
  if(!arr.length) return '';
  const max=arr[0][1];
  return `<div class="card"><h2>اتصرف في إيه الشهر ده؟</h2>${arr.map(([c,v])=>{const k=catOf(c);return `<div class="cbar"><span aria-hidden="true">${k.i}</span><span>${k.n}</span><b>${money(v,'')}</b><div class="bar"><i style="width:${Math.max(3,Math.round(v/max*100))}%"></i></div></div>`}).join('')}</div>`;
}
function rowV(t,me){
  const w=walletOf(me);
  let sign='',cls='';
  if(t.type==='expense'){sign='−';cls='neg'}else if(t.to===w){sign='+';cls='pos'}else if(t.from===w){sign='−';cls='neg'}else{sign='+';cls='pos'}
  const badges=(hasReceipt(t)?' 📷':'')+((t.edits||[]).length?' ✏️':'')+((t.thread||[]).length?' 💬':'');

function amtDisplay(v){if(!v)return `<div class="display">${dg('0')} <small>${cur()}</small></div>`;const [a,b]=v.split('.');return `<div class="display"><bdi>${dg((+a).toLocaleString('en-US'))}${v.includes('.')?dg('.')+dg(b||''):''}</bdi> <small>${cur()}</small></div>`}

  switch(s.k){

    case 'pay':return payV(s,me);

    case 'tx':return txV(s,me);
    case 'member':return memberV(s,me);

function payV(s,me){

  const b=bal('home'),a=+s.amount||0;

async function compress(file){
  return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const sc=Math.min(1,900/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(b=>{if(!b)return rej();const fr=new FileReader();fr.onload=()=>res({blob:b,data:fr.result});fr.readAsDataURL(b)},'image/jpeg',.55)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url});
}

  speakBal(){const me=meM();if(!me)return;const b=bal(walletOf(me));speak(`${me.role==='husband'?'مع '+wifeName():isParent(me)?'معاكي':'معاك'} ${sayMoney(b)}`)},
  dis(d){const me=meM();const k='masroofi_dis_'+me.id;const a=LS.get(k,[]);a.push(d.k);LS.set(k,a.slice(-300));render()},
  undo(){if(S.toast&&S.toast.undo){S.toast.undo();$('#toast').innerHTML='';S.toast=null;toast('اتلغى')}},
  pref(d){P[d.k]=d.k==='digits'?d.v:!!d.v;savePrefs();render()},
  flt(d){S.flt[d.k]=d.k==='deleted'?!!d.v:d.v;render()},
  seePerson(d){S.flt={period:'month',person:d.id,cat:'all',deleted:false};S.tab='list';render()},

  openRec(d){openSheet({k:'rec',step:'amount',amount:'',cat:null})},
  quick(d){openSheet({k:'rec',step:'amount',amount:'',cat:d.c,quickCat:true})},
  kp(d){const s=S.sheet;let v=s.amount||'';if(d.k==='del')v=v.slice(0,-1);else if(d.k==='.'){if(!v.includes('.'))v=(v||'0')+'.'}else{if(v==='0')v='';const dec=v.split('.')[1];if(dec&&dec.length>=2)return;if(v.replace('.','').length<9)v+=d.k}s.amount=v;render()},
  qa(d){S.sheet.amount=String(d.v);render()},
  recNext(){const s=S.sheet;s.step=s.quickCat&&s.cat?'confirm':'cat';render()},
  recBack(d){S.sheet.step=d.to;render()},
  recCat(d){S.sheet.cat=d.c;S.sheet.step='confirm';render()},
  recFor(d){S.sheet.forM=d.id||'';render()},
  rmRcpt(){S.sheet.receipt=null;render()},
  async recSave(){
    const me=meM(),s=S.sheet;const amount=+s.amount;const note=val('r_note').trim();
    if(!(amount>0))return;
    const w=walletOf(me);
    if(s.editId){
      const t=ST.d.tx[s.editId];if(!t)return closeSheet();
      const extra=s.receipt?await storeReceipt(s.receipt):{};
      const edits=(t.edits||[]).concat([{at:Date.now(),by:me.id,old:{amount:t.amount,cat:t.cat,note:t.note||''}}]);
      if(await W('update','tx',s.editId,Object.assign({amount,cat:s.cat,note,edits},extra))){closeSheet();toast('اتعدّل ✓ والتعديل ظاهر للأسرة')}
      return;
    }
    if(!isParent(me)&&!(isKid(me)&&fam().kidsNeg)&&amount>bal(w)) return toast(isKid(me)?'المبلغ أكبر من فلوسك. اطلب من بابا أو ماما.':'المبلغ أكبر من العُهدة. اطلبي فلوس الأول.','bad');
    if(me.role==='helper'&&amount>=(+fam().helperReceiptOver||100)&&!s.receipt) return toast('صوّري الفاتورة الأول','bad');
    const extra=await storeReceipt(s.receipt);
    const o=Object.assign({type:'expense',from:w,amount,cat:s.cat||'other',note},extra);
    if(s.forM)o.forM=s.forM;if(s.fixedId){o.fixedId=s.fixedId;o.fixedKey=s.fixedKey}
    closeSheet();
    const id=await addTx(me,o,`اتسجل ${num(amount)} ${cur()} ✓`);
    if(id&&P.speak) speak(`اتسجل ${catOf(o.cat).n} ${sayMoney(amount)}. الرصيد ${sayMoney(bal(w))}`);
  },

  openVoice(){openSheet({k:'voice',text:''})},
  toRec(){openSheet({k:'rec',step:'amount',amount:'',cat:null})},
  listen(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const s=S.sheet;
    if(!SR){s.srFail=true;return render()}
    if(s.listening&&recog){try{recog.stop()}catch(e){}return}
    try{
      recog=new SR();recog.lang='ar-EG';recog.interimResults=false;recog.maxAlternatives=1;
      recog.onresult=e=>{const txt=Array.from(e.results).map(r=>r[0].transcript).join(' ');const cur0=val('v_text');S.f.v_text=(cur0?cur0+' ':'')+txt;if(S.sheet)S.sheet.text=S.f.v_text;render()};
      recog.onerror=()=>{if(S.sheet){S.sheet.srFail=true;S.sheet.listening=false}render()};
      recog.onend=()=>{if(S.sheet){S.sheet.listening=false;if(val('v_text').trim())A.vParse();else render()}};
      recog.start();s.listening=true;render();
    }catch(e){s.srFail=true;s.listening=false;render()}
  },
  vParse(){
    const me=meM(),s=S.sheet;const text=val('v_text').trim();s.text=text;
    if(!text){s.err='اكتبي أو قولي حاجة الأول.';return render()}
    const items=parseSpeech(text,isKid(me));
    if(!items.length){s.err='مش فاهم المبلغ. قوليها تاني بالأرقام، مثلاً «خضار بـ ١٥٠».';return render()}
    s.err='';s.items=items;render();A.vSpeak();
  },
  vSpeak(){const s=S.sheet;if(!s||!s.items)return;const tot=s.items.reduce((a,b)=>a+b.amount,0);speak(s.items.map(i=>`${i.label||catOf(i.cat).n} ${i.amount}`).join('، و ')+`. المجموع ${sayMoney(tot)}. أسجّل؟`)},
  vDel(d){S.sheet.items.splice(+d.i,1);if(!S.sheet.items.length)S.sheet.items=null;render()},
  vRetry(){S.sheet.items=null;render()},
  async vSave(){
    const me=meM(),s=S.sheet,w=walletOf(me);const items=s.items.slice(),text=s.text;
    const tot=items.reduce((a,b)=>a+b.amount,0);
    if(!isParent(me)&&!(isKid(me)&&fam().kidsNeg)&&tot>bal(w)) return toast('المجموع أكبر من الرصيد اللي معاك','bad');
    if(me.role==='helper'&&items.some(i=>i.amount>=(+fam().helperReceiptOver||100))) {const it=items.find(i=>i.amount>=(+fam().helperReceiptOver||100));openSheet({k:'rec',step:'confirm',amount:String(it.amount),cat:it.cat,note:it.label});return toast('المبلغ ده محتاج صورة الفاتورة','bad')}
    closeSheet();
    const ids=[];
    for(const it of items){const id=uid();if(await W('set','tx',id,newTx(me,{type:'expense',from:w,amount:it.amount,cat:it.cat,note:it.label||'',voice:text})))ids.push(id)}
    if(ids.length){toast(`اتسجل ${dg(ids.length)} ${ids.length>1?'مصاريف':'مصروف'} بـ ${num(tot)} ${cur()} ✓`,'',async()=>{for(const id of ids)await W('delete','tx',id)});
      speak(`تمام، اتسجل. الرصيد ${sayMoney(bal(w))}`)}
  },

  openPay(d){const me=meM();const to=d.to||(me.role==='husband'?'home':(membersBy(m=>isKid(m)||m.role==='helper')[0]||{}).id);if(!to)return toast('مفيش أولاد أو مساعدة متضافين','bad');openSheet({k:'pay',to,kind:'monthly',amount:''})},
  payTo(d){S.sheet.to=d.id;render()},
  payKind(d){S.sheet.kind=d.v;render()},
  async paySave(){
    const me=meM(),s=S.sheet;const amount=+s.amount;if(!(amount>0)||!s.to)return;
    const note=val('p_note').trim();
    const o=me.role==='husband'?{type:'deposit',to:s.to,amount,note}:{type:'transfer',from:'home',to:s.to,amount,note};
    if(me.role==='husband'&&s.to==='home')o.kind=s.kind||'support';
    if(s.fixedId){o.fixedId=s.fixedId;o.fixedKey=s.fixedKey}
    const reqId=s.reqId;closeSheet();
    const id=await addTx(me,o,`اتدفع ${num(amount)} ${cur()} لـ ${nm(s.to)} ✓`);
    if(id&&reqId) await W('update','requests',reqId,{status:'paid',doneBy:me.id,doneAt:Date.now(),txId:id});
  },
  payReq(d){const me=meM(),r=ST.d.requests[d.id];if(!r)return;const fm=mem(r.from);
    let to=isParent(fm)?'home':r.from;
    if(me.role==='wife'&&to==='home')return toast('الطلب ده للزوج','bad');
    openSheet({k:'pay',to,kind:'support',amount:String(r.amount),reqId:d.id})},
  decReq(d){openSheet({k:'decline',id:d.id})},
  async decSend(){const me=meM(),s=S.sheet;const reply=val('d_reply').trim();closeSheet();await W('update','requests',s.id,{status:'declined',doneBy:me.id,doneAt:Date.now(),reply});toast('اتبعت الرد')},

  openReq(){openSheet({k:'req',amount:''})},
  qReason(d){S.f.q_reason=d.v;render()},
  async reqSend(){
    const me=meM(),s=S.sheet;const amount=+s.amount;if(!(amount>0))return;
    const reason=val('q_reason').trim();closeSheet();
    if(await W('set','requests',uid(),{from:me.id,to:me.role==='wife'?'husband':'parents',amount,reason,status:'sent',at:Date.now()}))toast('اتبعت الطلب ✓');
  },

  openTx(d){openSheet({k:'tx',id:d.id})},
  async ask(d){await sendMsg(d.v)},
  async askSend(){const v=val('t_msg').trim();if(!v)return;S.f.t_msg='';await sendMsg(v)},
  txEdit(){const t=ST.d.tx[S.sheet.id];openSheet({k:'rec',step:'amount',amount:String(t.amount),cat:t.cat,note:t.note||'',editId:S.sheet.id,hadReceipt:hasReceipt(t)})},
  txDel(){S.sheet.confirmDel=true;render()},
  txDelNo(){S.sheet.confirmDel=false;render()},
  async txDelYes(){const me=meM(),id=S.sheet.id;closeSheet();if(await W('update','tx',id,{deleted:true,deletedAt:Date.now(),deletedBy:me.id}))toast('اتمسح، وهيفضل ظاهر في المحذوفات')},

  fxPaid(d){const me=meM(),x=S.due[+d.i];if(!x)return;
    if(x.kind==='monthly')return addTx(me,{type:'deposit',to:'home',kind:'monthly',amount:+x.amount},`اتسجل مصروف الشهر ${num(x.amount)} ✓`);
    if(x.kind==='allowance'){const o=me.role==='husband'?{type:'deposit',to:x.memberId,amount:+x.amount}:{type:'transfer',from:'home',to:x.memberId,amount:+x.amount};o.fixedId=x.fid;o.fixedKey=x.key;return addTx(me,o,`اتسجل مصروف ${nm(x.memberId)} ✓`)}
    addTx(me,{type:'expense',from:'home',amount:+x.amount,cat:x.cat||'other',note:x.name,fixedId:x.fid,fixedKey:x.key},`اتسجل ${x.name} ✓`)},
  fxDiff(d){const me=meM(),x=S.due[+d.i];if(!x)return;
    if(x.kind==='monthly')return openSheet({k:'pay',to:'home',kind:'monthly',amount:String(x.amount)});
    if(x.kind==='allowance')return openSheet({k:'pay',to:x.memberId,amount:String(x.amount),fixedId:x.fid,fixedKey:x.key});
    openSheet({k:'rec',step:'amount',amount:String(x.amount),cat:x.cat,note:x.name,quickCat:true,fixedId:x.fid,fixedKey:x.key})},
  fxSkip(d){const x=S.due[+d.i];if(!x)return;
    if(x.kind==='monthly')return W('update','family',null,{skips:{[x.key]:true}});
    W('update','fixed',x.fid,{skips:{[x.key]:true}})},

  openMember(d){openSheet({k:'member',id:d.id||null,role:d.id?null:'son'})},
  memRole(d){S.sheet.role=d.r;render()},
  async memSave(){
    const me=meM(),s=S.sheet;const m=s.id?mem(s.id)||{}:{};const role=s.role||m.role;
    const name=val('m_name').trim();if(!name)return toast('اكتب الاسم','bad');
    const pin=normDigits(val('m_pin')).replace(/\D/g,'');if(pin&&(pin.length<4||pin.length>6))return toast('الرقم السري لازم من ٤ لـ ٦ أرقام','bad');
    const phone=normDigits(val('m_phone')).replace(/[^\d+]/g,'');
    const extra={};if(role==='helper')extra.float=parseAmt(val('m_float'));
    if(!s.id)extra.createdAt=Date.now();
    if(S.busy)return;S.busy=true;
    let id;
    try{id=await rpc('save_member',{p_token:ST.token,p_id:s.id||null,p_name:name,p_role:role,p_phone:phone||null,p_pin:pin||null,p_extra:extra})}
    catch(e){S.busy=false;return toast(errMsg(e.code),'bad')}
    S.busy=false;
    if(role==='son'||role==='daughter'){
      const amt=parseAmt(val('m_allow')),freq=val('m_freq')||'daily';
      const ex=Object.entries(ST.d.fixed).find(([,x])=>x.kind==='allowance'&&x.memberId===id);
      if(amt>0){const fx={kind:'allowance',memberId:id,name:`مصروف ${name}`,amount:amt,freq,day:freq==='monthly'?sd():freq==='weekly'?6:1,off:false};
        if(ex)await W('update','fixed',ex[0],fx);else await W('set','fixed',uid(),Object.assign(fx,{createdAt:Date.now()}))}
      else if(ex)await W('update','fixed',ex[0],{off:true});
    }
    closeSheet();toast(s.id?'اتحفظ ✓':`اتضاف ${name} ✓`);pull();
  },
  async memOff(){const s=S.sheet;closeSheet();try{await rpc('set_member_off',{p_token:ST.token,p_id:s.id,p_off:true});toast('اتوقف الحساب');pull()}catch(e){toast(errMsg(e.code),'bad')}},

  openFixed(d){openSheet({k:'fixed',id:d.id||null})},
  fxFreq(d){S.sheet.freq=d.v;render()},
  async fxSave(){
    const s=S.sheet;const x=s.id?ST.d.fixed[s.id]||{}:{};
    const name=val('x_name').trim(),amount=parseAmt(val('x_amount'));const freq=s.freq||x.freq||'monthly';
    if(!name||!(amount>0))return toast('اكتب الاسم والمبلغ','bad');
    const data={kind:'expense',name,cat:val('x_cat')||'other',amount,freq,day:freq==='daily'?1:+val('x_day')||(freq==='weekly'?0:1)};
    if(!s.id){data.createdAt=Date.now();data.off=false}
    closeSheet();if(await W(s.id?'update':'set','fixed',s.id||uid(),data))toast('اتحفظ ✓');
  },
  async fxToggle(){const s=S.sheet,x=ST.d.fixed[s.id];closeSheet();await W('update','fixed',s.id,{off:!x.off})},
  async fxDel(){const s=S.sheet;closeSheet();await W('delete','fixed',s.id);toast('اتمسح')},

  openSettings(){openSheet({k:'settings'})},
  kidsNeg(){W('update','family',null,{kidsNeg:!fam().kidsNeg})},
  async setSave(){
    const data={name:val('g_name').trim()||fam().name,monthly:parseAmt(val('g_monthly')),startDay:+val('g_day')||1,currency:val('g_cur')||'EGP',lowPct:Math.min(90,Math.max(1,parseAmt(val('g_low'))||20)),bigOver:parseAmt(val('g_big'))||500,helperReceiptOver:parseAmt(val('g_hr'))||100};
    closeSheet();if(await W('update','family',null,data))toast('اتحفظت الإعدادات ✓');
  },
  openReport(){openSheet({k:'report'})},
  copyReport(){const t=reportText(reportData());try{navigator.clipboard.writeText(t).then(()=>toast('اتنسخ ✓'),()=>toast('ما قدرتش أنسخ','bad'))}catch(e){toast('ما قدرتش أنسخ','bad')}},
  openInstall(){openSheet({k:'install'})},
  openGoal(){openSheet({k:'goal'})},
  async goalSave(){const me=meM();const name=val('gl_name').trim(),amount=parseAmt(val('gl_amount'));closeSheet();
    ST.d.members[me.id]=Object.assign({},ST.d.members[me.id],{goal:{name,amount}});render();
    try{await rpc('update_self',{p_token:ST.token,p_extra:{goal:{name,amount}}});toast('🎯 اتحفظ الهدف');pull()}catch(e){toast(errMsg(e.code),'bad')}},
};
async function sendMsg(text){
  const me=meM(),id=S.sheet.id,t=ST.d.tx[id];if(!t)return;
  await W('update','tx',id,{thread:(t.thread||[]).concat([{by:me.id,text,at:Date.now()}])});
}
function pinOf(id){return normDigits(val(id)).replace(/\D/g,'')}
async function authCall(fn,args,ok){
  if(S.busy)return;
  if(!/^\d{4,6}$/.test(args.p_pin||''))return toast(errMsg('bad_pin'),'bad');
  S.busy=true;render();
  try{const r=await rpc(fn,args);S.busy=false;
    if(r&&r.error){render();return toast(errMsg(r.error),'bad')}
    setSession(r);toast(ok);
  }catch(e){S.busy=false;render();toast(errMsg(e.code),'bad')}
}
async function doSwitch(id,pin){
  if(S.busy)return;S.busy=true;render();
  try{const r=await rpc('switch_member',{p_token:ST.token,p_member:id,p_pin:pin});S.busy=false;
    if(r&&r.error){if(S.sheet&&S.sheet.k==='pin')S.sheet.v='';render();return toast(errMsg(r.error==='bad_pin'?'bad_pin_try':r.error),'bad')}
    const old=ST.token;setSession(r);if(old&&old!==r.token)rpc('logout',{p_token:old}).catch(()=>{});
  }catch(e){S.busy=false;render();if(e.code==='not_signed_in')return signOut(true);toast(errMsg(e.code),'bad')}
}
function init(){
  render();
  if(ST.token){pull(!ST.rev);flush()}
  rtStart();
  setInterval(()=>{if(ST.token&&document.visibilityState==='visible'){if(Q.length)flush();else pull();if(!RT)rtStart()}},5000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ST.token){flush();pull()}});
  window.addEventListener('online',()=>{ST.online=true;flush();pull()});
  window.addEventListener('offline',()=>{ST.online=false;changed()});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installEvt=e;changed()});
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const f=A[el.dataset.a];if(!f)return;
  if(el.tagName==='A')return;
  if(el.dataset.a!=='ovClose')e.preventDefault();
  f(el.dataset,el,e);
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='r_file'&&el.files&&el.files[0]){try{S.sheet.receipt=await compress(el.files[0]);render()}catch(err){toast('الصورة ما اتفتحتش. جرّب صورة تانية.','bad')}return}
  if(el.dataset.ch==='fltSel'){S.flt[el.dataset.k]=el.value;delete S.f[el.id];render();return}
  if(el.dataset.ch==='vcat'&&S.sheet&&S.sheet.items){S.sheet.items[+el.dataset.i].cat=el.value;delete S.f[el.id];render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet&&S.sheet.k!=='pin')closeSheet()});

init();
})();
</script>
